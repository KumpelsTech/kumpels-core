<title>Kumpels Core</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
:root{
  --bg:#EEF1F6; --surface:#FFFFFF; --surface-2:#EEF2FB; --surface-3:#F6F8FC; --surface-hover:#F2F5FA;
  --border:#E2E7EF; --border-strong:#CBD3E1; --border-soft:#EDF0F6;
  --navy:#182755; --navy-700:#213467; --navy-600:#2C4183;
  --ink:#16203A; --ink-2:#48566E; --ink-3:#7C8804; --muted:#78859B; --muted-2:#9AA6BB;
  --accent:#2F4BC4; --accent-soft:#E7ECFB; --accent-ink:#2338A0;
  --sb-bg:#111C3B; --sb-bg-2:#0C1531; --sb-text:#9AA6C6; --sb-text-dim:#6A769B; --sb-active:#22335F; --sb-brandline:#5468B8;
  --warn:#D9820A; --warn-bg:#FBF0DD; --warn-line:#F0D8A8;
  --crit:#CE4B45; --crit-bg:#FAE9E7; --crit-line:#EFC9C6;
  --ok:#2C9865; --ok-bg:#E3F3EB; --ok-line:#BEE3CE;
  --info:#2F4BC4; --info-bg:#E7ECFB; --info-line:#CBD6F5;
  --neutral:#5D6A82; --neutral-bg:#EDF0F5;
  --shadow-sm:0 1px 2px rgba(20,30,60,.06); --shadow:0 4px 14px rgba(20,30,60,.08); --shadow-lg:0 12px 34px rgba(20,30,60,.14);
  --radius:10px; --radius-sm:7px; --radius-lg:14px;
  --sans:'IBM Plex Sans',-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;
  --mono:'IBM Plex Mono',ui-monospace,SFMono-Regular,Menlo,monospace;
}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{background:var(--bg);color:var(--ink);font-family:var(--sans);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased;}
button{font-family:inherit;cursor:pointer;color:inherit}
input,select{font-family:inherit;font-size:inherit;color:inherit}
::selection{background:#c9d4f5}
.mono{font-family:var(--mono)}
.tnum{font-variant-numeric:tabular-nums}

/* ---------- App shell ---------- */
.app{display:grid;grid-template-columns:236px 1fr;min-height:100vh;}
.sidebar{background:linear-gradient(180deg,var(--sb-bg) 0%,var(--sb-bg-2) 100%);color:var(--sb-text);display:flex;flex-direction:column;position:sticky;top:0;height:100vh;overflow-y:auto;}
.brand{padding:18px 18px 16px;border-bottom:1px solid rgba(255,255,255,.07);}
.brand-row{display:flex;align-items:center;gap:10px;}
.brand-mark{width:30px;height:30px;border-radius:8px;background:linear-gradient(135deg,#3C5AD6,#5A73E8);display:flex;align-items:center;justify-content:center;color:#fff;font-weight:700;font-size:16px;flex:0 0 auto;box-shadow:inset 0 0 0 1px rgba(255,255,255,.15)}
.brand-name{font-weight:700;color:#fff;font-size:15px;letter-spacing:.2px;line-height:1.1}
.brand-sub{font-size:10.5px;color:var(--sb-brandline);letter-spacing:.6px;text-transform:uppercase;font-weight:600;margin-top:2px}
.org-chip{margin:12px 12px 0;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.08);border-radius:8px;padding:8px 10px;display:flex;align-items:center;justify-content:space-between;gap:8px;cursor:pointer}
.org-chip:hover{background:rgba(255,255,255,.09)}
.org-chip .o-name{color:#EAEEFA;font-weight:600;font-size:12.5px}
.org-chip .o-sub{color:var(--sb-text-dim);font-size:10.5px}
.org-chip .chev{color:var(--sb-text-dim);font-size:11px}
.nav{padding:14px 10px 20px;display:flex;flex-direction:column;gap:2px}
.nav-group{font-size:10px;letter-spacing:1.1px;text-transform:uppercase;color:var(--sb-text-dim);font-weight:600;padding:12px 10px 5px}
.nav-item{display:flex;align-items:center;gap:10px;padding:8px 10px;border-radius:7px;color:var(--sb-text);font-size:13px;font-weight:500;border:none;background:none;width:100%;text-align:left;transition:background .12s,color .12s}
.nav-item:hover{background:rgba(255,255,255,.06);color:#E7ECF8}
.nav-item.active{background:var(--sb-active);color:#fff;font-weight:600;box-shadow:inset 2px 0 0 #6E86EA}
.nav-item .ico{width:16px;height:16px;flex:0 0 auto;opacity:.85}
.nav-item.active .ico{opacity:1}
.nav-badge{margin-left:auto;background:var(--warn);color:#fff;font-size:10.5px;font-weight:600;border-radius:20px;padding:1px 7px;font-family:var(--mono)}
.nav-badge.crit{background:var(--crit)}

/* ---------- Top bar ---------- */
.main{display:flex;flex-direction:column;min-width:0}
.topbar{height:56px;background:var(--surface);border-bottom:1px solid var(--border);display:flex;align-items:center;gap:14px;padding:0 22px;position:sticky;top:0;z-index:30}
.search{flex:1;max-width:440px;position:relative}
.search input{width:100%;height:36px;border:1px solid var(--border);background:var(--surface-3);border-radius:8px;padding:0 12px 0 34px;outline:none;font-size:13px}
.search input:focus{border-color:var(--accent);background:#fff;box-shadow:0 0 0 3px var(--accent-soft)}
.search .s-ico{position:absolute;left:11px;top:9px;color:var(--muted-2)}
.top-spacer{flex:1}
.ask-btn{display:flex;align-items:center;gap:7px;height:36px;padding:0 14px;border-radius:8px;background:var(--navy);color:#fff;border:none;font-weight:600;font-size:13px;box-shadow:var(--shadow-sm)}
.ask-btn:hover{background:var(--navy-700)}
.ask-btn .spark{font-size:13px}
.icon-btn{width:36px;height:36px;border-radius:8px;border:1px solid var(--border);background:var(--surface);display:flex;align-items:center;justify-content:center;color:var(--ink-2);position:relative}
.icon-btn:hover{background:var(--surface-hover)}
.icon-btn .dot{position:absolute;top:7px;right:8px;width:7px;height:7px;border-radius:50%;background:var(--crit);border:1.5px solid #fff}
.user-chip{display:flex;align-items:center;gap:9px;padding:3px 6px 3px 3px;border-radius:22px;border:1px solid var(--border);background:var(--surface)}
.user-chip:hover{background:var(--surface-hover)}
.avatar{width:30px;height:30px;border-radius:50%;background:linear-gradient(135deg,#2C4183,#3C5AD6);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:600;font-size:12px;flex:0 0 auto}
.user-chip .u-name{font-weight:600;font-size:12.5px;line-height:1.05}
.user-chip .u-role{font-size:10.5px;color:var(--muted)}

/* ---------- Content ---------- */
.content{padding:22px 26px 44px;max-width:1560px;width:100%;margin:0 auto}
.page-head{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:18px}
.page-title{font-size:22px;font-weight:700;letter-spacing:-.3px;margin:0;color:var(--ink)}
.page-sub{color:var(--ink-2);font-size:13.5px;margin-top:3px}
.page-meta{text-align:right;color:var(--muted);font-size:12px}
.page-meta strong{color:var(--ink-2);font-weight:600;display:block;font-size:12.5px}

/* KPI */
.kpi-row{display:grid;gap:12px;margin-bottom:20px}
.kpi{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);padding:13px 14px;position:relative;overflow:hidden}
.kpi .k-label{font-size:11.5px;color:var(--ink-2);font-weight:500;line-height:1.25;min-height:29px}
.kpi .k-val{font-size:26px;font-weight:700;letter-spacing:-.5px;margin-top:6px;font-family:var(--mono)}
.kpi .k-foot{font-size:11px;color:var(--muted);margin-top:3px;display:flex;align-items:center;gap:5px}
.kpi .k-accent{position:absolute;left:0;top:0;bottom:0;width:3px}
.kpi.attn .k-val{color:var(--warn)} .kpi.attn .k-accent{background:var(--warn)}
.kpi.crit .k-val{color:var(--crit)} .kpi.crit .k-accent{background:var(--crit)}
.kpi.calm .k-accent{background:var(--accent)}
.kpi.good .k-accent{background:var(--ok)}

/* Cards / sections */
.card{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);}
.section-head{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 16px;border-bottom:1px solid var(--border-soft)}
.section-title{font-size:14.5px;font-weight:700;color:var(--ink);display:flex;align-items:center;gap:9px}
.section-title .st-sub{font-weight:400;color:var(--muted);font-size:12px}
.section-desc{color:var(--ink-2);font-size:12.5px}
.grid{display:grid;gap:16px}

/* Badges */
.badge{display:inline-flex;align-items:center;gap:5px;height:20px;padding:0 8px;border-radius:5px;font-size:10.5px;font-weight:600;letter-spacing:.3px;text-transform:uppercase;white-space:nowrap}
.badge.hi{background:var(--crit-bg);color:#B23A35;box-shadow:inset 0 0 0 1px var(--crit-line)}
.badge.action{background:var(--warn-bg);color:#B26A05;box-shadow:inset 0 0 0 1px var(--warn-line)}
.badge.monitor{background:var(--neutral-bg);color:#556280;box-shadow:inset 0 0 0 1px #DBE1EC}
.badge.ok{background:var(--ok-bg);color:#1F7A4E;box-shadow:inset 0 0 0 1px var(--ok-line)}
.badge.info{background:var(--info-bg);color:var(--accent-ink);box-shadow:inset 0 0 0 1px var(--info-line)}
.badge.plain{background:var(--surface-2);color:var(--ink-2);box-shadow:inset 0 0 0 1px var(--border)}
.tag{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;color:var(--ink-2);background:var(--surface-3);border:1px solid var(--border);border-radius:6px;padding:2px 8px;font-weight:500}
.tag .t-ico{color:var(--muted-2)}
.cat{display:inline-flex;align-items:center;height:19px;padding:0 7px;border-radius:5px;font-size:10px;font-weight:700;letter-spacing:.5px;text-transform:uppercase}

/* Priority queue */
.pq{display:flex;flex-direction:column}
.pq-item{display:grid;grid-template-columns:4px 1fr auto;gap:0;border-bottom:1px solid var(--border-soft);cursor:pointer;transition:background .12s}
.pq-item:last-child{border-bottom:none}
.pq-item:hover{background:var(--surface-hover)}
.pq-stripe{width:4px}
.pq-stripe.hi{background:var(--crit)} .pq-stripe.action{background:var(--warn)} .pq-stripe.monitor{background:var(--neutral)}
.pq-body{padding:13px 16px;min-width:0}
.pq-top{display:flex;align-items:center;gap:9px;flex-wrap:wrap}
.pq-name{font-weight:700;font-size:14px;color:var(--ink)}
.pq-id{font-family:var(--mono);font-size:11px;color:var(--muted)}
.pq-reason{color:var(--ink-2);font-size:12.5px;margin-top:5px;max-width:70ch}
.pq-meta{display:flex;gap:8px;margin-top:9px;flex-wrap:wrap}
.pq-right{padding:13px 16px;display:flex;flex-direction:column;align-items:flex-end;justify-content:center;gap:8px;border-left:1px solid var(--border-soft);min-width:190px}
.pq-next{font-size:11px;color:var(--muted);text-align:right}
.pq-next b{display:block;color:var(--accent-ink);font-size:12.5px;font-weight:600;margin-top:1px}
.next-btn{display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 12px;border-radius:7px;background:var(--surface);border:1px solid var(--border-strong);color:var(--navy);font-weight:600;font-size:12px}
.next-btn:hover{background:var(--navy);color:#fff;border-color:var(--navy)}
.pq-due{font-size:11px;font-weight:600}
.pq-due.late{color:var(--crit)} .pq-due.soon{color:var(--warn)}

/* Journey timeline */
.journey{display:flex;align-items:flex-start;width:100%}
.jstage{flex:1;display:flex;flex-direction:column;align-items:center;position:relative;min-width:0}
.jstage .jline{position:absolute;top:11px;height:2px;background:var(--border-strong);left:-50%;right:50%;z-index:0}
.jstage:first-child .jline{display:none}
.jstage .jline.done{background:var(--ok)}
.jstage .jdot{width:24px;height:24px;border-radius:50%;background:var(--surface);border:2px solid var(--border-strong);display:flex;align-items:center;justify-content:center;z-index:1;position:relative;font-size:11px;color:var(--muted-2);font-weight:700}
.jstage.done .jdot{background:var(--ok);border-color:var(--ok);color:#fff}
.jstage.current .jdot{background:#fff;border-color:var(--accent);color:var(--accent);box-shadow:0 0 0 4px var(--accent-soft)}
.jstage.warning .jdot{background:#fff;border-color:var(--warn);color:var(--warn);box-shadow:0 0 0 4px var(--warn-bg)}
.jstage.blocked .jdot{background:#fff;border-color:var(--crit);color:var(--crit);box-shadow:0 0 0 4px var(--crit-bg)}
.jstage .jlabel{font-size:10.5px;color:var(--muted);margin-top:7px;text-align:center;font-weight:500;line-height:1.25;max-width:92px}
.jstage.done .jlabel{color:var(--ink-2)}
.jstage.current .jlabel{color:var(--accent-ink);font-weight:700}
.jstage.warning .jlabel{color:#B26A05;font-weight:700}
.jstage.blocked .jlabel{color:#B23A35;font-weight:700}
.jstage .jsub{font-size:9.5px;color:var(--muted-2);margin-top:2px;text-align:center;font-family:var(--mono)}

/* Journey cards */
.jcards{display:grid;grid-template-columns:1fr;gap:14px}
.jcard{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);padding:16px 18px;cursor:pointer;transition:box-shadow .14s,border-color .14s,transform .06s}
.jcard:hover{box-shadow:var(--shadow);border-color:var(--border-strong)}
.jcard:active{transform:translateY(1px)}
.jc-head{display:flex;align-items:flex-start;justify-content:space-between;gap:14px;flex-wrap:wrap}
.jc-idn{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.jc-name{font-weight:700;font-size:15.5px;color:var(--ink)}
.jc-badges{display:flex;gap:7px;align-items:center;flex-wrap:wrap}
.jc-meta{display:flex;gap:8px;margin-top:9px;flex-wrap:wrap;align-items:center}
.jc-journey{margin:20px 4px 8px}
.jc-foot{display:flex;align-items:flex-start;justify-content:space-between;gap:18px;margin-top:18px;padding-top:14px;border-top:1px solid var(--border-soft);flex-wrap:wrap}
.jc-next{display:flex;flex-direction:column;gap:2px}
.jc-next .lbl{font-size:10px;text-transform:uppercase;letter-spacing:.6px;color:var(--muted);font-weight:600}
.jc-next .val{font-weight:600;color:var(--navy);font-size:13px;display:flex;align-items:center;gap:7px}
.jc-obs{font-size:12px;color:var(--ink-2);max-width:46ch;text-align:right;background:var(--surface-3);border:1px solid var(--border-soft);border-radius:8px;padding:8px 11px}
.jc-obs.warn{background:var(--warn-bg);border-color:var(--warn-line);color:#8A5203}

/* Filter bar */
.filterbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:16px}
.f-search{position:relative;flex:0 0 260px}
.f-search input{width:100%;height:34px;border:1px solid var(--border);border-radius:8px;padding:0 10px 0 32px;background:var(--surface);outline:none;font-size:13px}
.f-search input:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.f-search .s-ico{position:absolute;left:10px;top:8px;color:var(--muted-2)}
.fsel{position:relative}
select.fsel-el{height:34px;border:1px solid var(--border);border-radius:8px;background:var(--surface);padding:0 30px 0 11px;font-size:12.5px;color:var(--ink-2);font-weight:500;outline:none;appearance:none;cursor:pointer}
select.fsel-el:focus{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-soft)}
.seg{display:inline-flex;background:var(--surface-2);border:1px solid var(--border);border-radius:9px;padding:3px;gap:3px;margin-left:auto}
.seg button{border:none;background:none;padding:6px 13px;border-radius:6px;font-size:12.5px;font-weight:600;color:var(--ink-2)}
.seg button.on{background:var(--surface);color:var(--navy);box-shadow:var(--shadow-sm)}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.chip{border:1px solid var(--border);background:var(--surface);border-radius:20px;padding:6px 13px;font-size:12.5px;font-weight:600;color:var(--ink-2)}
.chip:hover{background:var(--surface-hover)}
.chip.on{background:var(--navy);color:#fff;border-color:var(--navy)}
.chip .c-count{font-family:var(--mono);opacity:.7;margin-left:5px;font-size:11px}
.chip.on .c-count{opacity:.85}

/* Schedule / lists */
.sched{display:flex;flex-direction:column}
.sched-row{display:grid;grid-template-columns:64px 1fr auto;gap:14px;padding:11px 16px;border-bottom:1px solid var(--border-soft);align-items:center}
.sched-row:last-child{border-bottom:none}
.sched-row:hover{background:var(--surface-hover);cursor:pointer}
.sched-time{font-family:var(--mono);font-weight:600;font-size:13px;color:var(--navy)}
.sched-main .sm-name{font-weight:600;font-size:13.5px}
.sched-main .sm-sub{font-size:12px;color:var(--ink-2);margin-top:1px}
.opsnap{display:flex;flex-direction:column;gap:1px}
.opsnap-row{display:flex;align-items:center;gap:11px;padding:10px 16px;border-bottom:1px solid var(--border-soft)}
.opsnap-row:last-child{border-bottom:none}
.opsnap-num{font-family:var(--mono);font-weight:700;font-size:16px;width:26px;text-align:center}
.opsnap-row .os-txt{font-size:12.5px;color:var(--ink-2)}

/* Patient 360 */
.p360-head{background:var(--surface);border:1px solid var(--border);border-radius:var(--radius-lg);padding:18px 20px;margin-bottom:16px}
.p360-top{display:flex;align-items:flex-start;gap:16px;justify-content:space-between;flex-wrap:wrap}
.p360-id{display:flex;gap:15px;align-items:center}
.p360-av{width:52px;height:52px;border-radius:13px;background:linear-gradient(135deg,#2C4183,#4059B0);color:#fff;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:19px;flex:0 0 auto}
.p360-name{font-size:21px;font-weight:700;letter-spacing:-.3px;line-height:1.1}
.p360-line{display:flex;gap:9px;align-items:center;margin-top:6px;flex-wrap:wrap;color:var(--ink-2);font-size:12.5px}
.p360-line .dot-sep{width:3px;height:3px;border-radius:50%;background:var(--muted-2)}
.p360-badges{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.p360-team{display:flex;gap:22px;margin-top:16px;padding-top:15px;border-top:1px solid var(--border-soft);flex-wrap:wrap}
.team-m .tm-lbl{font-size:10px;text-transform:uppercase;letter-spacing:.6px;color:var(--muted);font-weight:600}
.team-m .tm-name{font-weight:600;font-size:13px;margin-top:2px;display:flex;align-items:center;gap:7px}
.team-av{width:22px;height:22px;border-radius:50%;background:var(--surface-2);color:var(--navy);display:inline-flex;align-items:center;justify-content:center;font-size:10px;font-weight:700;border:1px solid var(--border)}

.hero-action{display:grid;grid-template-columns:1fr auto;gap:18px;background:linear-gradient(120deg,#1A2A57,#233a76);color:#fff;border-radius:var(--radius-lg);padding:18px 22px;margin-bottom:16px;align-items:center}
.hero-action .ha-lbl{font-size:10.5px;letter-spacing:.8px;text-transform:uppercase;color:#A9B6DE;font-weight:600}
.hero-action .ha-title{font-size:18px;font-weight:700;margin-top:5px}
.hero-action .ha-when{display:flex;gap:9px;align-items:center;margin-top:7px;color:#C6D0EC;font-size:12.5px}
.hero-pill{display:inline-flex;align-items:center;gap:6px;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.16);border-radius:20px;padding:2px 10px;font-size:11px;font-weight:600}
.hero-action .ha-reason{color:#C6D0EC;font-size:12.5px;margin-top:10px;max-width:64ch;line-height:1.5}
.ha-cta{display:flex;flex-direction:column;gap:9px;align-items:stretch}
.btn-primary{background:#fff;color:var(--navy);border:none;border-radius:9px;padding:11px 20px;font-weight:700;font-size:13.5px;white-space:nowrap;box-shadow:var(--shadow-sm)}
.btn-primary:hover{background:#EEF2FB}
.ha-status{font-size:11px;color:#A9B6DE;text-align:center}

.tabs{display:flex;gap:2px;border-bottom:1px solid var(--border);margin-bottom:18px}
.tab{border:none;background:none;padding:11px 15px;font-size:13.5px;font-weight:600;color:var(--ink-2);border-bottom:2px solid transparent;margin-bottom:-1px}
.tab:hover{color:var(--ink)}
.tab.on{color:var(--navy);border-bottom-color:var(--navy)}

.two-col{display:grid;grid-template-columns:1.55fr 1fr;gap:16px;align-items:start}
.info-card{padding:15px 16px}
.info-card h4{margin:0 0 12px;font-size:12px;text-transform:uppercase;letter-spacing:.5px;color:var(--muted);font-weight:700;display:flex;align-items:center;gap:8px}
.kv{display:flex;justify-content:space-between;gap:14px;padding:7px 0;border-bottom:1px dashed var(--border-soft);font-size:13px}
.kv:last-child{border-bottom:none}
.kv .k{color:var(--ink-2)} .kv .v{font-weight:600;text-align:right}
.stack{display:flex;flex-direction:column;gap:16px}

  IV:['Prescripción','Revisión clínica','Autorización','Programación','Preparación','Administración','Seguimiento'],
  Infusión:['Prescripción','Revisión clínica','Autorización','Programación','Preparación','Administración','Seguimiento'],
  Oral:['Prescripción','Revisión clínica','Autorización','Dispensación','Reabastecimiento','Seguimiento'],
  SC:['Prescripción','Revisión clínica','Autorización','Dispensación','Aplicación','Próxima aplicación'],
};
function jstages(mod, states, subs){ // states: array matching template; subs optional
  const t = TEMPLATES[mod]; return t.map((label,i)=>({label, state:states[i]||'upcoming', sub:(subs&&subs[i])||''}));
}

/* ============ HELPERS ============ */
const el = s=>document.querySelector(s);
const esc = s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function priBadge(p){const m={HIGH:'hi',ACTION:'action',MONITOR:'monitor'};const lbl={HIGH:'Alta',ACTION:'Acción',MONITOR:'Monitoreo'};return `<span class="badge ${m[p]}">${lbl[p]||p}</span>`;}
function priStripe(p){return {HIGH:'hi',ACTION:'action',MONITOR:'monitor'}[p]||'monitor';}
function catBg(cat){
  const map={'REVISIÓN CLÍNICA':['var(--info-bg)','var(--accent-ink)'],'REABASTECIMIENTO':['var(--warn-bg)','#B26A05'],'PENDIENTE':['var(--warn-bg)','#B26A05'],'NUEVO PACIENTE':['var(--ok-bg)','#1F7A4E'],'AUTORIZACIÓN':['var(--warn-bg)','#B26A05'],'SEGUIMIENTO':['var(--warn-bg)','#B26A05'],'PROGRAMADO':['var(--neutral-bg)','#556280'],'REVISADO':['var(--ok-bg)','#1F7A4E'],'APLICACIÓN':['var(--neutral-bg)','#556280'],'DISPENSACIÓN':['var(--neutral-bg)','#556280'],'ALTO COSTO':['var(--neutral-bg)','#556280']};
  const c=map[cat]||['var(--surface-2)','var(--ink-2)'];return `<span class="cat" style="background:${c[0]};color:${c[1]}">${esc(cat)}</span>`;}
function tag(ico,txt){return `<span class="tag"><span class="t-ico">${I[ico]||''}</span>${esc(txt)}</span>`;}
function journeyHTML(p){
  return `<div class="journey">`+p.journey.map(st=>{
    const cls=st.state==='done'?'done':st.state==='current'?'current':st.state==='warning'?'warning':st.state==='blocked'?'blocked':'';
    const lineDone=(st.state==='done')?'done':'';
    const glyph=st.state==='done'?I.check:'';
    return `<div class="jstage ${cls}"><span class="jline ${lineDone}"></span><span class="jdot">${glyph}</span><span class="jlabel">${esc(st.label)}</span>${st.sub?`<span class="jsub">${esc(st.sub)}</span>`:''}</div>`;
  }).join('')+`</div>`;}
function chSmall(ch){const m={wa:'wa',phone:'phone','in':'loc'};return I[m[ch]||'msg'];}
function commStatus(s){const ok=['Entregado','Confirmado','Programado'];const warn=['Pendiente','Sin respuesta','Por enviar','En gestión','Por realizar'];
  if(ok.includes(s))return `<span class="badge ok" style="height:18px">${esc(s)}</span>`;
  if(warn.includes(s))return `<span class="badge action" style="height:18px">${esc(s)}</span>`;
  return `<span class="badge plain" style="height:18px">${esc(s)}</span>`;}

function jFilter(){
  const f=STATE.jf;
  return PATIENTS.filter(p=>{
    if(f.seg==='atencion'&&p.priority==='MONITOR')return false;
    if(f.seg==='hoy'&&!(p.due==='Hoy'||(p.cat==='PROGRAMADO')||p.name==='Laura Martínez'))return false;
    if(f.sede&&p.facility!==f.sede)return false;
    if(f.conv&&p.payer!==f.conv)return false;
    if(f.mod&&p.modality!==f.mod)return false;
    if(f.pri&&p.priority!==f.pri)return false;
    if(f.q){const q=f.q.toLowerCase();if(!(p.name.toLowerCase().includes(q)||p.id.toLowerCase().includes(q)||p.dx.toLowerCase().includes(q)||(p.protocol||'').toLowerCase().includes(q)))return false;}
    return true;
  });
}

const REVIEW_IDS=['ONC-2041','ONC-2037','ONC-2018','ONC-2055','ONC-2011','ONC-2050','ONC-2033'];
function reviewTrigger(p){
  const m={'REVISIÓN CLÍNICA':'Cambio de tratamiento detectado. Un criterio clínico configurado requiere revisión antes del próximo ciclo.',
    'NUEVO PACIENTE':'Paciente nuevo. Requiere conciliación de medicación y entrevista inicial de atención farmacéutica.',
    'REABASTECIMIENTO':'Medicación oral fuera de la ventana esperada de reabastecimiento. Posible riesgo de adherencia.',
    'SEGUIMIENTO':'Seguimiento programado vencido sin registro de contacto.',
    'AUTORIZACIÓN':'Autorización requerida no recibida. Revisión de acceso al tratamiento.',
    'ALTO COSTO':'Medicamento de alto costo en monitoreo de continuidad y adherencia.'};
  return m[p.cat]||p.reason;
}
function cfFilter(){
  const f=STATE.cf;
  let list=REVIEW_IDS.map(id=>P_BY_ID[id]);
  const chip=f.chip;
  list=list.filter(p=>{
    if(chip==='alta'&&p.priority!=='HIGH')return false;
    if(chip==='cambios'&&p.cat!=='REVISIÓN CLÍNICA')return false;
    if(chip==='nuevos'&&p.cat!=='NUEVO PACIENTE')return false;
    if(chip==='alertas'&&!(p.priority==='HIGH'))return false;
    if(chip==='seguimiento'&&!(p.cat==='SEGUIMIENTO'||p.cat==='REABASTECIMIENTO'))return false;
    if(chip==='altocosto'&&p.cat!=='ALTO COSTO')return false;
    if(f.sede&&p.facility!==f.sede)return false;
    if(f.conv&&p.payer!==f.conv)return false;
    if(f.mod&&p.modality!==f.mod)return false;
    return true;
  });
  const order={HIGH:0,ACTION:1,MONITOR:2};
  return list.sort((a,b)=>order[a.priority]-order[b.priority]);
}

  const cyc=(p.cycle&&p.cycle!=='Continuo')?`Ciclo ${esc(p.cycle)}`:'Tratamiento continuo';

      <div class="rcg"><div class="lbl">${I.shield} Criterio configurado</div><div class="txt">${esc(p.alert.criterion)}</div></div>
      <div class="rcg"><div class="lbl">${I.doc} Fuente</div><div class="txt">${esc(p.alert.source)}</div></div>

function barRow(lbl,val,max,color){const pct=Math.round(val/max*100);return `<div class="bar-row"><div class="bar-lbl">${esc(lbl)}</div><div class="bar-track"><div class="bar-fill" style="width:${pct}%;background:${color}"></div></div><div class="bar-val tnum">${val}</div></div>`;}
function donut(segs){ // segs: {label,val,color}
  const total=segs.reduce((a,s)=>a+s.val,0);let acc=0;const r=52,c=2*Math.PI*r;
  const arcs=segs.map(s=>{const frac=s.val/total;const dash=frac*c;const el=`<circle cx="70" cy="70" r="${r}" fill="none" stroke="${s.color}" stroke-width="18" stroke-dasharray="${dash} ${c-dash}" stroke-dashoffset="${-acc*c}" transform="rotate(-90 70 70)"/>`;acc+=frac;return el;}).join('');
  const legend=segs.map(s=>`<div class="legend-item"><span class="legend-sw" style="background:${s.color}"></span>${esc(s.label)}<span class="legend-val tnum">${s.val}</span></div>`).join('');
  return `<div class="donut-wrap"><svg width="140" height="140" viewBox="0 0 140 140">${arcs}<text x="70" y="66" text-anchor="middle" font-size="26" font-weight="700" fill="var(--ink)" font-family="var(--mono)">${total}</text><text x="70" y="86" text-anchor="middle" font-size="10" fill="var(--muted)" font-family="var(--sans)">pacientes</text></svg><div class="legend">${legend}</div></div>`;
}
function trendChart(){
  const data=[62,58,66,71,68,74,79];const labels=['S1','S2','S3','S4','S5','S6','S7'];const max=90,min=50;const W=440,H=140,pad=24;
  const pts=data.map((v,i)=>[pad+i*((W-pad*2)/(data.length-1)), H-pad-((v-min)/(max-min))*(H-pad*2)]);
  const path=pts.map((p,i)=>(i?'L':'M')+p[0].toFixed(1)+' '+p[1].toFixed(1)).join(' ');
  const area=`M${pts[0][0]} ${H-pad} `+pts.map(p=>'L'+p[0].toFixed(1)+' '+p[1].toFixed(1)).join(' ')+` L${pts[pts.length-1][0]} ${H-pad} Z`;
  const grid=[0,1,2,3].map(g=>{const y=pad+g*((H-pad*2)/3);return `<line x1="${pad}" y1="${y}" x2="${W-pad}" y2="${y}" stroke="var(--border-soft)" stroke-width="1"/>`;}).join('');
  const dots=pts.map((p,i)=>`<circle cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="${i===pts.length-1?4:2.5}" fill="${i===pts.length-1?'var(--accent)':'#fff'}" stroke="var(--accent)" stroke-width="2"/>`).join('');
  const xlab=labels.map((l,i)=>`<text x="${pts[i][0].toFixed(1)}" y="${H-6}" text-anchor="middle" font-size="9" fill="var(--muted)">${l}</text>`).join('');
  return `<div style="padding:16px"><svg width="100%" viewBox="0 0 ${W} ${H}" preserveAspectRatio="xMidYMid meet">${grid}<path d="${area}" fill="var(--accent-soft)" opacity=".7"/><path d="${path}" fill="none" stroke="var(--accent)" stroke-width="2.5" stroke-linejoin="round"/>${dots}${xlab}<text x="${pad}" y="14" font-size="9" fill="var(--muted)">% seguimientos completados · últimas 7 semanas</text></svg></div>`;
}

function toast(msg){
  let t=el('#toast'); if(!t){t=document.createElement('div');t.id='toast';t.style.cssText='position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(20px);background:var(--navy);color:#fff;padding:11px 18px;border-radius:10px;font-size:13px;font-weight:500;box-shadow:var(--shadow-lg);z-index:120;opacity:0;transition:opacity .2s,transform .2s;display:flex;align-items:center;gap:9px;max-width:90vw';document.body.appendChild(t);}
  t.innerHTML=I.check+'<span>'+esc(msg)+'</span>';
  requestAnimationFrame(()=>{t.style.opacity='1';t.style.transform='translateX(-50%) translateY(0)';});
  clearTimeout(toastT);toastT=setTimeout(()=>{t.style.opacity='0';t.style.transform='translateX(-50%) translateY(20px)';},2600);
}

/* ============ EVENTS ============ */
function openPatient(id){STATE.patient=id;STATE.view='patient';STATE.ptab='resumen';render();}
document.addEventListener('click',e=>{
  const t=e.target.closest('[data-open],[data-nav],[data-ptab],[data-jseg],[data-cf-chip],[data-explain],[data-ask-open],[data-ask-close],[data-ask-q],[data-ask-reset],[data-toast]');
  if(!t)return;
  if(t.hasAttribute('data-ask-close')){closeAsk();return;}
  if(t.hasAttribute('data-ask-open')){openAsk();return;}
  if(t.hasAttribute('data-ask-q')){STATE.askAns=t.getAttribute('data-ask-q');el('#drawer').innerHTML=askDrawer();return;}
  if(t.hasAttribute('data-ask-reset')){STATE.askAns=null;el('#drawer').innerHTML=askDrawer();return;}
  if(t.hasAttribute('data-explain')){const id=t.getAttribute('data-explain');openAsk();if(id==='ONC-2041'){STATE.askAns='q3';el('#drawer').innerHTML=askDrawer();}return;}
  if(t.hasAttribute('data-toast')){toast(t.getAttribute('data-toast'));return;}
  if(t.hasAttribute('data-ptab')){STATE.ptab=t.getAttribute('data-ptab');render();return;}
  if(t.hasAttribute('data-jseg')){STATE.jf.seg=t.getAttribute('data-jseg');render();return;}
  if(t.hasAttribute('data-cf-chip')){STATE.cf.chip=t.getAttribute('data-cf-chip');render();return;}
  if(t.hasAttribute('data-open')){openPatient(t.getAttribute('data-open'));return;}
  if(t.hasAttribute('data-nav')){const v=t.getAttribute('data-nav');if(!v)return;STATE.view=v;render();return;}
});
document.addEventListener('change',e=>{
  const s=e.target;
  if(s.hasAttribute('data-noop'))return;
  if(s.hasAttribute('data-jf')){STATE.jf[s.getAttribute('data-jf')]=s.value;render();return;}
  if(s.hasAttribute('data-cf')){STATE.cf[s.getAttribute('data-cf')]=s.value;const r=el('#cfresults');if(r)r.innerHTML=cfResults();return;}
  if(s.hasAttribute('data-of')){STATE.of[s.getAttribute('data-of')]=s.value;render();return;}
});
document.addEventListener('input',e=>{
  const s=e.target;
  if(s.hasAttribute('data-live')&&s.getAttribute('data-jf')==='q'){STATE.jf.q=s.value;const r=el('#jresults');if(r)r.innerHTML=jResultsHTML();return;}
});
el('#scrim').addEventListener('click',closeAsk);
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeAsk();});

/* ============ INIT ============ */
render();
</script>
